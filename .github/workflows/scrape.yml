name: Scrape used gear

on:
  schedule:
    - cron: "0 6,18 * * *"   # 06:00 and 18:00 UTC daily
  workflow_dispatch:          # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run scraper
        run: python scraper/scrape.py

      - name: Commit updated listings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/listings.json
          git diff --cached --quiet || git commit -m "Update listings $(date -u +'%Y-%m-%d %H:%M')"
          git push
